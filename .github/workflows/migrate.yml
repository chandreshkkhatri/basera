name: Migrate production DB

# Applies Drizzle migrations to the production database on every push to main.
# The web app (Drizzle) owns the schema; the Python engine only inserts. Keeping
# migrations here — not in the Vercel build — decouples deploys from DB access
# and means the app never boots against an un-migrated schema.
#
# Requires a repo secret PROD_DATABASE_URL (the *direct*, non-pooled connection
# string from your Postgres provider). Inert until that secret is set.

on:
  push:
    branches: [main]
    paths:
      - "web/drizzle/**"
      - "web/src/db/schema.ts"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_SSL: "true"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL secret not set — skipping."
            exit 0
          fi
          npx drizzle-kit migrate

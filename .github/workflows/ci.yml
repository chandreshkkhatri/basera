name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The app connects to Postgres at request time, not during build, and the
      # layout tolerates an unavailable DB — so a placeholder URL is enough here.
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          ADMIN_TOKEN: ci

  ingestion:
    name: ingestion (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r ingestion/requirements.txt
      - run: python -m compileall -q ingestion

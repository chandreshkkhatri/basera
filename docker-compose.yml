services:
  postgres:
    image: postgres:16-alpine
    container_name: basera-postgres
    environment:
      POSTGRES_USER: basera
      POSTGRES_PASSWORD: basera
      POSTGRES_DB: basera
    ports:
      # host 5433 to avoid clashing with a system Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basera"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
